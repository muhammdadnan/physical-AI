<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg">
  <!-- Robot head/body -->
  <rect x="20" y="20" width="60" height="60" rx="10" fill="#2e8555" stroke="#1a5d38" stroke-width="2"/>

  <!-- Eyes -->
  <circle cx="35" cy="40" r="5" fill="white"/>
  <circle cx="65" cy="40" r="5" fill="white"/>
  <circle cx="35" cy="40" r="2" fill="black"/>
  <circle cx="65" cy="40" r="2" fill="black"/>

  <!-- Mouth/speaker -->
  <rect x="40" y="60" width="20" height="5" rx="2" fill="#1a5d38"/>

  <!-- Decorative elements -->
  <circle cx="50" cy="25" r="3" fill="#ffd700"/>

  <!-- Arms to make it look more humanoid -->
  <line x1="15" y1="40" x2="20" y2="40" stroke="#1a5d38" stroke-width="3"/>
  <line x1="80" y1="40" x2="85" y2="40" stroke="#1a5d38" stroke-width="3"/>

  <!-- Base -->
  <rect x="40" y="80" width="20" height="10" fill="#1a5d38"/>
</svg>